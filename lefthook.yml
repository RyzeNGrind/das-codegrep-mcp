# lefthook.yml — pre-commit gates (run inside nix develop)
# Install: ./bin/install-hooks
# trufflehog excluded: not in nixos-unstable x86_64-linux 2026-05
# run manually: nix profile install nixpkgs#trufflehog && trufflehog filesystem . --fail
pre-commit:
  parallel: true
  commands:
    nix-fmt:
      run: nixpkgs-fmt --check flake.nix nix/*.nix
    statix:
      run: statix check .
    tsc:
      run: bash -lc 'cd src && [ -d node_modules ] || npm install --ignore-scripts --no-fund --no-audit >/dev/null 2>&1; npx tsc --noEmit'
    semgrep:
      run: semgrep scan --config auto --error --exclude node_modules --exclude dist .
    gitleaks:
      run: gitleaks dir . --no-banner
